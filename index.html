
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cozy Room</title>
    <link rel="icon" type="image/png" href="imagesat4/teddybear.PNG">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!--
For this project I decided to choose click as the main
interaction since it's the most common way to interact with web elements 
which is so familiar with users. My idea is creating a bedroom with warm
and cozy atmostphere, users will explore objects in room by clicking on them.
Rather than putting to much instructions on the screen, I want users feeling like
they are actually exploring the room. I used Procreate to draw the room and objects,
I drew the background and objects separately so I could be able to change their
apperance without affecting the background. To make the experience more immersive,
each object has its own animation and sound effects so users wont get bored. 
-->

    <main>
        <h1>My Cozy Room</h1>
        <p class="instruction">Click around and make yourself at home ♡</p>

        <div class="room" id="room">

            <div class="light-effect" id="lightEffect"></div>

            <button class="object lamp" id="lamp" aria-label="Turn lamp on">
                <img src="imagesat4/lampoff.PNG" alt="Lamp" id="lampImage">
            </button>

            <button class="object radio" id="radio" aria-label="Play radio">
                <img src="imagesat4/radio.PNG" alt="Radio" id="radioImage">
            </button>

            <button class="object book" id="book" aria-label="Open book">
                <img src="imagesat4/bookclose.PNG" alt="Book" id="bookImage">
            </button>

            <button class="object plant" id="plant" aria-label="Make plant bloom">
                <img src="imagesat4/plant.PNG" alt="Plant" id="plantImage">
            </button>

            <button class="object teddy" id="teddy" aria-label="Hug teddy bear">
                <img src="imagesat4/teddybear.PNG" alt="Teddy bear">
            </button>

            <p class="message" id="message" aria-live="polite"></p>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
